name: Multi-Harness Overfitting Audit

on:
  schedule:
    - cron: '0 0 * * 1' # Run weekly every Monday at midnight
  workflow_dispatch:

jobs:
  audit-eval:
    name: Run Multi-Harness HOC Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Execute Overfitting Audit
        run: |
          python examples/run_eval_audit.py
