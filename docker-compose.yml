version: "3.8"

services:
  polyharness-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: polyharness:latest
    container_name: polyharness-studio
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
